<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quick Pay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      width: 90%;
      max-width: 360px;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
    }

    h2 {
      margin-bottom: 10px;
      color: #333;
    }

    p {
      font-size: 14px;
      color: #666;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 20px 0;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ddd;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: #667eea;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #5a67d8;
    }

    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>Quick Pay</h2>
  <p>Pay securely using UPI</p>

  <input type="number" id="amount" placeholder="Enter amount (₹)" />

  <button onclick="payNow()">Pay Now</button>

  <div class="footer">
    Powered by UPI
  </div>
</div>

<script>
function payNow() {
  const amountInput = document.getElementById("amount");
  const amount = amountInput.value.trim();
  const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);

  // Validation
  if (amount === "" || Number(amount) <= 0) {
    alert("Please enter a valid amount to proceed.");
    amountInput.focus();
    return; // STOP here
  }

  if (isMobile) {
    window.location.href =
      `upi://pay?pa=merchant@upi&pn=QuickPay&am=${amount}&cu=INR`;
  } else {
    alert("Please open this link on your mobile to complete payment via UPI.");
    window.open("https://pay.google.com", "_blank");
  }
}
</script>


</body>
</html>
