<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quick Pay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: white;
      width: 95%;
      max-width: 380px;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
      color: #333;
    }

    h4 {
      margin: 15px 0 5px;
      color: #444;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 15px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    button {
      background: #667eea;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #5a67d8;
    }

    .divider {
      margin: 15px 0;
      border-top: 1px solid #eee;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #999;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>Quick Pay</h2>

  <!-- ADD HELPER -->
  <h4>Add Helper</h4>
  <input type="text" id="helperName" placeholder="Helper Name">
  <input type="text" id="helperRole" placeholder="Role (Cleaner / Cook)">
  <input type="text" id="helperUpi" placeholder="UPI ID or Mobile@upi">

  <button onclick="addHelper()">Add Helper</button>

  <div class="divider"></div>

  <!-- SELECT HELPER -->
  <h4>Pay Helper</h4>
  <select id="helperSelect">
    <option value="">Select Helper</option>
  </select>

  <input type="number" id="amount" placeholder="Enter amount (₹)" min="1">

  <button onclick="payNow()">Pay Now</button>

  <div class="footer">Powered by UPI</div>
</div>

<script>
let helpers = [];

function addHelper() {
  const name = document.getElementById("helperName").value.trim();
  const role = document.getElementById("helperRole").value.trim();
  const upi = document.getElementById("helperUpi").value.trim();

  const upiRegex = /^[a-zA-Z0-9.\-_]{2,}@[a-zA-Z0-9]{2,}$/;

  if (!name || !role || !upi) {
    alert("Please fill all helper details.");
    return;
  }

  if (!upiRegex.test(upi)) {
    alert("Please enter a valid UPI ID or mobile@upi.");
    return;
  }

  helpers.push({ name, role, upi });

  updateHelperDropdown();

  document.getElementById("helperName").value = "";
  document.getElementById("helperRole").value = "";
  document.getElementById("helperUpi").value = "";

  alert("Helper added successfully.");
}

function updateHelperDropdown() {
  const select = document.getElementById("helperSelect");
  select.innerHTML = `<option value="">Select Helper</option>`;

  helpers.forEach((h, index) => {
    const option = document.createElement("option");
    option.value = index;
    option.textContent = `${h.name} (${h.role})`;
    select.appendChild(option);
  });
}

function payNow() {
  const helperIndex = document.getElementById("helperSelect").value;
  const amount = document.getElementById("amount").value.trim();
  const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);

  if (helperIndex === "") {
    alert("Please select a helper.");
    return;
  }

  if (!amount || Number(amount) <= 0) {
    alert("Please enter a valid amount.");
    return;
  }

  const helper = helpers[helperIndex];

  if (isMobile) {
    window.location.href =
      `upi://pay?pa=${encodeURIComponent(helper.upi)}&pn=${encodeURIComponent(helper.name)}&am=${amount}&cu=INR`;
  } else {
    alert("Please open this page on mobile to complete payment via UPI.");
  }
}
</script>

</body>
</html>
